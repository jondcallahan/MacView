name: MacView
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc.git
    revision: 090b96eddeee183e9fec293c5cd881d302a4349d
targets:
  MacView:
    type: application
    platform: iOS
    sources: [MacView]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: RoyalVNCKit
        embed: true
        codeSign: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).MacView
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: MacView
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "MacView connects to Macs on your network so you can see and control their screens."
    info:
      path: MacView/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_rfb._tcp, _device-info._tcp]
